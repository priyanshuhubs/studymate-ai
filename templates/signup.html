{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<!-- Page 2: Dark-Themed Student Registration -->
<section class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">✦</div>
      <h1>Create Your Account</h1>
      <p class="muted">Start organizing assignments, notes, and AI study schedules in seconds.</p>
    </div>

    <form method="POST" action="{{ url_for('signup') }}" class="form-stack">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          placeholder="e.g., Aarav Sharma"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="student@college.edu"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="At least 6 characters"
          minlength="6"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Re-enter your password"
          minlength="6"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-footer muted">
      Already have an account?
      <a href="{{ url_for('login') }}" class="text-link">Log in here</a>
    </p>
  </div>
</section>
{% endblock %}
