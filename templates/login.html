{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<!-- Page 1: Dark-Themed Student Login -->
<section class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">✦</div>
      <h1>Welcome to StudyMate AI</h1>
      <p class="muted">Log in to manage your study notes, tasks, and personalized revision plans.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="form-stack">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="student@college.edu"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-full">Log In</button>
    </form>

    <p class="auth-footer muted">
      New to StudyMate AI?
      <a href="{{ url_for('signup') }}" class="text-link">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
